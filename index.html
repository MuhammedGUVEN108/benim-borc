*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}button,input,select{font:inherit}button,input,select{min-height:46px}button{cursor:pointer;color:inherit;border:0;border-radius:12px;background:#25334b;padding:11px 16px;touch-action:manipulation}button:disabled{opacity:.45;cursor:default}button:hover{filter:brightness(1.12)}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--yellow);outline-offset:3px}::selection{background:#335a76;color:white}input,select{width:100%;padding:12px;background:var(--bg);color:var(--text);border:1px solid #40506a;border-radius:10px;font-size:16px;caret-color:var(--green)}input[type=color]{padding:5px}input::placeholder{color:var(--muted)}label{display:block;margin:16px 0 6px;color:#bdc9da}h1,h2,h3,p{margin:0}h1{font-size:24px;letter-spacing:-.02em}h2{font-size:19px;margin-bottom:14px}h3{font-size:16px}small,.muted{color:var(--muted)}small{font-size:12px}.app{max-width:760px;margin:auto;padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 115px)}header,.heading,.row,.actions{display:flex;align-items:center;justify-content:space-between;gap:12px}header{margin-bottom:26px}header small{display:block}.icon{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}.icon-button{width:46px;padding:10px;background:var(--surface)}.balance{margin:4px 0 26px}.balance strong{display:block;font-size:clamp(34px,9vw,52px);letter-spacing:-.03em;line-height:1.25;margin:8px 0}.text-btn{background:transparent;color:#c3d6f3;padding:8px 0;text-align:left}.panel{background:var(--surface);border-radius:16px;padding:20px;margin-bottom:22px}.section{margin:26px 0}.row{min-height:72px;border-bottom:1px solid var(--border);padding:12px 0}.row:last-child{border-bottom:0}.row .main{flex:1;min-width:0;overflow-wrap:anywhere}.row .right{text-align:right;flex-shrink:0}.row small{display:block}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;flex-shrink:0}.positive{color:var(--green)}.danger{color:var(--red)}.warning{padding:14px 16px;border:1px solid #804653;border-radius:12px;background:#312331;color:#ffc1c8;margin-bottom:22px}.notice{padding:12px 16px;background:#25334b;border-radius:12px;margin:12px 0;color:#cad6e7}.primary{background:var(--green);color:#09291c;font-weight:700}.secondary{background:var(--surface);border:1px solid #40506a}.delete{color:var(--red);background:transparent}.full{width:100%}.empty{padding:30px 8px;color:var(--muted);text-align:center}.badge{font-size:11px;border:1px solid #536076;border-radius:6px;padding:2px 6px;white-space:nowrap}.tabs{position:fixed;z-index:10;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);padding:8px 8px calc(env(safe-area-inset-bottom) + 8px);display:grid;grid-template-columns:1fr 1fr 1.3fr 1fr 1fr;gap:4px;max-width:800px;margin:auto}.tabs button{background:transparent;color:var(--muted);font-size:11px;padding:6px 0;border-radius:12px;min-height:55px}.tabs .icon{display:block;margin:0 auto 3px}.tabs button.active{color:var(--green);background:#192e2c}.tabs .add{background:var(--green);color:#09291c;font-weight:700;font-size:13px}.tabs .add .icon{width:25px;height:25px}.segments{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:12px}.segments button{flex:1;background:transparent;font-size:13px;padding:8px;min-height:44px}.segments .active{background:#31415b;color:white}.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;margin:12px 0}.legend i{display:inline-block;width:16px;height:3px;vertical-align:middle;margin-right:5px}.chart-scroll{overflow-x:auto;overscroll-behavior-x:contain;margin:0 -8px;scrollbar-color:#41516a var(--surface)}.chart-scroll svg{display:block;max-width:none}.chart-note{font-size:12px;color:var(--muted);margin-top:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.onboarding{padding:24px}.onboarding h1{font-size:28px;margin:12px 0}.onboarding p{color:#b4c2d5;margin:12px 0 20px}.step{font-size:13px;color:var(--green)}.sheet-head{position:sticky;top:0;background:var(--surface);padding:18px 20px;border-bottom:1px solid var(--border);z-index:1}.sheet-body{padding:0 20px 24px}dialog{background:var(--surface);color:var(--text);border:0;border-radius:20px 20px 0 0;padding:0;max-width:560px;width:100%;max-height:90dvh;margin:auto auto 0;overflow:auto;box-shadow:0 -12px 48px #0006}dialog::backdrop{background:#0009}.sheet-head h2{margin:0}.form-actions{display:flex;gap:10px;margin-top:24px}.form-actions button{flex:1}.toast{position:fixed;z-index:50;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translateX(-50%);padding:12px 18px;background:#e8eef7;color:#152034;border-radius:12px;max-width:90%;box-shadow:0 6px 24px #0006}.error{color:#ffabb5;margin-top:12px}.help{color:#b4c2d5;font-size:13px;margin-top:8px}details{margin:18px 0}summary{cursor:pointer;min-height:44px;padding:10px 0}details p{color:#b4c2d5;margin:12px 0}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}[hidden]{display:none!important}@media(min-width:600px){dialog{margin:auto;border-radius:20px}.app{padding-left:32px;padding-right:32px}}@media(prefers-reduced-motion:no-preference){dialog[open]{animation:enter .2s ease-out}@keyframes enter{from{transform:translateY(20px)}to{transform:translateY(0)}}}
/* iPhone 15 Pro Max: Dynamic Island, home indicator ve yatay tutus icin guvenli alanlar. */
.app{padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}.sheet-body{padding-bottom:calc(24px + env(safe-area-inset-bottom))}.tabs{padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right))}input,select,button{-webkit-tap-highlight-color:transparent}.form-actions{flex-wrap:wrap}.form-actions button{min-width:100px}dialog{max-height:calc(100dvh - env(safe-area-inset-top) - 12px)}
.cash-chart{touch-action:pan-y}.chart-readout{min-height:86px;margin-top:6px;padding:12px 0;border-top:1px solid var(--border)}.chart-readout .heading{align-items:flex-start;font-size:12px;gap:8px}.chart-readout strong{font-size:18px;white-space:nowrap}.chart-readout small{display:block;margin-top:5px;overflow-wrap:anywhere}.cash-chart [data-point]{cursor:crosshair}

<body>
<main class="app" id="app"></main>
<nav class="tabs" id="nav" aria-label="Ana menü"></nav>
<dialog id="sheet" aria-labelledby="sheetTitle"><div class="sheet-head heading"><h2 id="sheetTitle"></h2><button class="icon-button" id="closeSheet" aria-label="Kapat"></button></div><div class="sheet-body" id="sheetBody"></div></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<script>
'use strict';
// Tüm tutarlar kuruş olarak saklanır: 0,1 + 0,2 gibi kayan nokta hataları birikmez.
const KEY='benim-borc-v1', $=s=>document.querySelector(s), uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const paths={home:'M3 10 12 3l9 7v11h-6v-7H9v7H3Z',list:'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',card:'M3 5h18v14H3ZM3 10h18M6 15h4',plan:'M4 5h16v16H4ZM8 3v4M16 3v4M4 11h16M8 15h2M14 15h2',plus:'M12 4v16M4 12h16',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1Z',close:'m6 6 12 12M6 18 18 6'};
const icon=n=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.list}"/></svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function day(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function date(s){return new Date(s+'T12:00:00')}
const today=()=>day(), shift=(s,n)=>{const d=date(s);d.setDate(d.getDate()+n);return day(d)}, fmt=(n,sign=false)=>(sign&&n>0?'+':'')+new Intl.NumberFormat('tr-TR',{maximumFractionDigits:2}).format(n/100)+' TL';
const short=s=>date(s).toLocaleDateString('tr-TR',{day:'numeric',month:'short'}), long=s=>date(s).toLocaleDateString('tr-TR',{day:'numeric',month:'long'});
function monthDay(y,m,d){return day(new Date(y,m,Math.min(d,new Date(y,m+1,0).getDate()),12))}
function validDate(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&s>='2000-01-01'&&s<='2100-12-31'&&day(date(s))===s}
function money(s){s=String(s).trim().replace(/\s|TL|₺/gi,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^[-+]?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');if(!/^[-+]?\d+(\.\d{1,2})?$/.test(s))throw Error('Geçerli bir tutar girin. Örnek: 12.450,50');const n=Number(s);if(!Number.isFinite(n)||Math.abs(n)>1e10)throw Error('Geçerli bir tutar girin. Örnek: 12.450,50');return Math.round(n*100)}
const amountInput=n=>new Intl.NumberFormat('tr-TR',{useGrouping:false,maximumFractionDigits:2}).format((n||0)/100);
function fresh(){return {version:1,setup:0,initial:0,lastMethod:'cash',cards:[{id:'is',name:'İş Bankası',cut:null,due:null,color:'#B388FF'},{id:'yapi',name:'Yapı Kredi',cut:null,due:null,color:'#FF9F43'},{id:'ziraat',name:'Ziraat',cut:null,due:null,color:'#2EC4D6'}],expenses:[],incomes:[],rules:[],payments:[],adjustments:[],backupAt:null}}
let storageError='',state=fresh(),tab='home',range=1,filter='all',toastTimer,focusBefore;
// Yedek de aynı doğrulayıcıdan geçer; bozuk veri mevcut defteri sessizce ezemez.
function validate(o){
 if(!o||o.version!==1||![0,1,2].includes(o.setup)||!Number.isSafeInteger(o.initial)||Math.abs(o.initial)>1e12)throw Error('Bu dosya geçerli bir Benim Borç yedeği değil.');
 for(const k of ['cards','expenses','incomes','rules','payments','adjustments'])if(!Array.isArray(o[k])||o[k].length>10000)throw Error('Yedekte eksik veya çok fazla kayıt var.');
 if(o.cards.length!==3)throw Error('Yedek üç kart tanımı içermeli.');
 const ids=new Set();for(const c of o.cards){if(!['is','yapi','ziraat'].includes(c.id)||ids.has(c.id)||typeof c.name!=='string'||c.name.length>80||!/^#[0-9a-f]{6}$/i.test(c.color))throw Error('Kart bilgileri geçersiz.');ids.add(c.id);for(const k of ['cut','due'])if(c[k]!==null&&(!Number.isInteger(c[k])||c[k]<1||c[k]>31))throw Error('Kart günü 1–31 arasında olmalı.');}
 for(const k of ['expenses','incomes','rules','payments','adjustments']){const seen=new Set();for(const r of o[k]){if(typeof r.id!=='string'||r.id.length>100||seen.has(r.id)||!Number.isSafeInteger(r.amount)||Math.abs(r.amount)>1e12||(k!=='adjustments'&&r.amount<=0))throw Error('İşlem tutarı veya kimliği geçersiz.');seen.add(r.id);if(!validDate(k==='rules'?r.start:r.date))throw Error('İşlem tarihi geçersiz.');if(k==='expenses'&&!['cash',...ids].includes(r.method))throw Error('Ödeme yöntemi geçersiz.');if(k==='rules'&&(!Number.isInteger(r.day)||r.day<1||r.day>31))throw Error('Gelir günü geçersiz.');if(k==='payments'&&!['once','monthly'].includes(r.repeat))throw Error('Tekrar bilgisi geçersiz.');if(k==='incomes'&&typeof r.confirmed!=='boolean')throw Error('Gelir durumu geçersiz.');for(const field of ['name','note'])if(r[field]!==undefined&&(typeof r[field]!=='string'||r[field].length>160))throw Error('Metin alanı geçersiz.');}}
 if(o.setup===2&&o.cards.some(c=>!c.cut||!c.due))throw Error('Kart günleri eksik.');return o;
}
try{const raw=localStorage.getItem(KEY);if(raw)state=validate(JSON.parse(raw));}catch(e){storageError='Kayıtlar okunamadı. Yedekten yükleyebilir veya yeni kayıtlarla başlayabilirsiniz. Eski veri, ilk başarılı kayda kadar değiştirilmez.';}
function persist(next){try{validate(next);localStorage.setItem(KEY,JSON.stringify(next));state=next;storageError='';return true}catch(e){storageError='Kaydedilemedi: '+e.message+' Yedek alın; bu değişiklik uygulanmadı.';toast(storageError);return false}}
function commit(change){const next=structuredClone(state);change(next);if(persist(next)){render();return true}return false}
function toast(t){clearTimeout(toastTimer);$('#toast').textContent=t;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,5500)}
// Ekstre takvimi: kesim günü dahildir; ödeme, kesimden kesinlikle sonra gelir.
function statement(exp,card){let d=date(exp.date),cut=monthDay(d.getFullYear(),d.getMonth(),card.cut);if(exp.date>cut)cut=monthDay(d.getFullYear(),d.getMonth()+1,card.cut);d=date(cut);let due=monthDay(d.getFullYear(),d.getMonth(),card.due);if(due<=cut)due=monthDay(d.getFullYear(),d.getMonth()+1,card.due);return {cut,due}}
function statements(){const map=new Map();for(const e of state.expenses){if(e.method==='cash')continue;const c=state.cards.find(c=>c.id===e.method);if(!c?.cut||!c.due)continue;const s=statement(e,c),key=c.id+'|'+s.cut;if(!map.has(key))map.set(key,{id:key,card:c.id,cut:s.cut,date:s.due,amount:0,name:c.name,color:c.color,kind:'statement'});map.get(key).amount+=e.amount}return [...map.values()].sort((a,b)=>a.date.localeCompare(b.date))}
function occurrences(start,end,d){let cur=date(start),last=date(end),result=[];for(let y=cur.getFullYear(),m=cur.getMonth();y<last.getFullYear()||y===last.getFullYear()&&m<=last.getMonth();){const s=monthDay(y,m,d);if(s>=start&&s<=end)result.push(s);if(++m===12){m=0;y++}}return result}
// Tek olay listesi hem bakiyeyi hem grafiği besler; iki ekran farklı hesap yapmaz.
// Düzenli gelir ve planlı ödeme vadesinde gerçekleşmiş varsayılır; tekil bekleyen gelir onay ister.
function events(end){const out=[],t=today();const add=(r,kind,amount,extra={})=>out.push({...r,kind,amount,...extra});
 for(const e of state.expenses)if(e.method==='cash')add(e,'expense',-e.amount,{name:e.note||'Nakit harcama'});
 for(const i of state.incomes)add(i,'income',i.amount,{pending:!i.confirmed,date:!i.confirmed&&i.date<t?t:i.date,originalDate:i.date});
 for(const r of state.rules)for(const d of occurrences(r.start,end,r.day))add({...r,date:d,id:r.id+'|'+d},'rule',r.amount);
 for(const p of state.payments)for(const d of p.repeat==='monthly'?occurrences(p.date,end,date(p.date).getDate()):[p.date])add({...p,date:d,id:p.id+'|'+d},'payment',-p.amount);
 for(const s of statements())add(s,'statement',-s.amount);
 for(const a of state.adjustments)add(a,'adjustment',a.amount,{name:'Bakiye düzeltmesi'});
 return out.filter(e=>e.date<=end).sort((a,b)=>a.date.localeCompare(b.date)||(a.kind==='adjustment'?1:0)-(b.kind==='adjustment'?1:0)||a.id.localeCompare(b.id));
}
function current(ev=events(today())){return state.initial+ev.filter(e=>e.date<=today()&&!e.pending).reduce((s,e)=>s+e.amount,0)}
function future(ev){return ev.filter(e=>e.date>today()||e.pending)}
function openSheet(title,html){focusBefore=document.activeElement;$('#sheetTitle').textContent=title;$('#sheetBody').innerHTML=html;if(!$('#sheet').open)$('#sheet').showModal();$('#sheetBody').scrollTop=0;setTimeout(()=>$('#sheetBody input, #sheetBody button, #sheetBody select')?.focus(),60)}
function closeSheet(){$('#sheet').close();focusBefore?.focus?.()}
$('#closeSheet').innerHTML=icon('close');$('#closeSheet').onclick=closeSheet;
function form(title,body,save,extra=''){openSheet(title,`<form id="editor">${body}<p class="error" id="formError" role="alert"></p><div class="form-actions"><button type="button" class="secondary" data-action="close">Vazgeç</button><button class="primary" type="submit">Kaydet</button></div>${extra}</form>`);$('#editor').onsubmit=e=>{e.preventDefault();try{save(new FormData(e.target))}catch(err){$('#formError').textContent=err.message}}}
const field=(label,name,value='',type='text',attrs='')=>`<label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${attrs}>`;
const amountField=n=>field('Tutar (TL)','amount',n===undefined?'':amountInput(n),'text','inputmode="decimal" required placeholder="0,00" maxlength="24"');
const dateField=(v=today(),label='Tarih',name='date')=>field(label,name,v,'date','min="2000-01-01" max="2100-12-31" required');
const nameField=v=>field('Ad','name',v||'','text','required maxlength="80" placeholder="Örn. KYK bursu"');
function readAmount(f,negative=false){const n=money(f.get('amount'));if(!negative&&n<=0)throw Error('Tutar sıfırdan büyük olmalı.');return n}
function readDate(f,name='date'){const s=f.get(name);if(!validDate(s))throw Error('Geçerli bir tarih seçin.');return s}
function upsert(s,key,item){const i=s[key].findIndex(r=>r.id===item.id);if(i<0)s[key].push(item);else s[key][i]=item}
function editTransaction(kind,id){const key=kind==='expense'?'expenses':'incomes',old=state[key].find(x=>x.id===id),e=old||{};const method=e.method||state.lastMethod||'cash';
 const methodHtml=`<label for="f-method">Ödeme yöntemi</label><select id="f-method" name="method">${[{id:'cash',name:'Nakit'},...state.cards].map(c=>`<option value="${c.id}" ${method===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`;
 form((old?'Düzenle · ':'')+(kind==='expense'?'Harcama':'Tek seferlik gelir'),amountField(e.amount)+(kind==='expense'?methodHtml+field('Not (isteğe bağlı)','note',e.note||'','text','maxlength="160"'):nameField(e.name))+dateField(e.date)+`<p class="help">${kind==='expense'?'Kartlı harcama bakiyeden son ödeme gününde düşer.':'Bugün/geçmiş: Geldi. Gelecek: Bekleniyor; vadesinde onay sorulur.'}</p>`,f=>{const d=readDate(f),item={id:e.id||uid(),amount:readAmount(f),date:d};if(kind==='expense'){item.method=f.get('method');item.note=f.get('note').trim()}else{item.name=f.get('name').trim();if(!item.name)throw Error('Gelir adını girin.');item.confirmed=d<=today()}
 if(commit(s=>{upsert(s,key,item);if(kind==='expense')s.lastMethod=item.method})){closeSheet();toast('İşlem kaydedildi.')}},old?`<button type="button" class="delete full" data-action="delete" data-key="${key}" data-id="${esc(id)}">Bu işlemi sil</button>`:'');
}
function editPlan(kind,id){const key=kind==='rule'?'rules':'payments',old=state[key].find(r=>r.id===id),r=old||{};
 form((old?'Düzenle · ':'')+(kind==='rule'?'Düzenli gelir':'Planlı ödeme'),nameField(r.name)+amountField(r.amount)+(kind==='rule'?field('Ayın kaçında?','day',r.day||1,'number','min="1" max="31" required')+dateField(r.start||today(),'Kuralın başlangıcı','start'):`${dateField(r.date)}<label for="f-repeat">Tekrar</label><select name="repeat" id="f-repeat"><option value="once">Tek seferlik</option><option value="monthly" ${r.repeat==='monthly'?'selected':''}>Aylık</option></select>`)+`<p class="help">Ayda seçilen gün yoksa ayın son günü kullanılır. ${kind==='rule'?'Geçen vadeler otomatik gerçekleşmiş sayılır.':'Vadesi gelen ödeme otomatik ödenmiş sayılır.'} Düzenleme/silme geçmiş hesapları da günceller.</p>`,f=>{const item={id:r.id||uid(),name:f.get('name').trim(),amount:readAmount(f)};if(!item.name)throw Error('Ad girin.');if(kind==='rule'){item.day=Number(f.get('day'));item.start=readDate(f,'start');if(!Number.isInteger(item.day)||item.day<1||item.day>31)throw Error('Gün 1–31 arasında olmalı.')}else{item.date=readDate(f);item.repeat=f.get('repeat')}if(commit(s=>upsert(s,key,item))){closeSheet();toast('Plan kaydedildi.')}},old?`<button type="button" class="delete full" data-action="delete" data-key="${key}" data-id="${esc(id)}">Bu kuralı sil</button>`:'');
}

 let dragging=false,dragStart=0,moved=false;
 svgEl.addEventListener('pointerdown',e=>{dragging=true;moved=false;dragStart=e.clientX;svgEl.setPointerCapture?.(e.pointerId);select(nearest(e.clientX))});
 svgEl.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||dragging){if(dragging&&Math.abs(e.clientX-dragStart)>5)moved=true;select(nearest(e.clientX));if(dragging&&moved){const r=chart.getBoundingClientRect();if(e.clientX>r.right-25)chart.scrollLeft+=14;else if(e.clientX<r.left+25)chart.scrollLeft-=14}}});
 svgEl.addEventListener('pointerup',()=>{dragging=false});svgEl.addEventListener('pointercancel',()=>{dragging=false});
 // Gezinirken yanlışlıkla ayrıntı penceresi açılmaz; tek dokunuş da bakiyeyi seçer.
 svgEl.addEventListener('click',e=>{const node=e.target.closest('[data-point]');if(node){select(e.detail===0?Number(node.dataset.point):nearest(e.clientX));e.stopPropagation()}else if(moved)e.stopPropagation()});
 svgEl.addEventListener('focusin',e=>{const node=e.target.closest('[data-point]');if(node)select(Number(node.dataset.point))});
 svgEl.addEventListener('keydown',e=>{const node=e.target.closest('[data-point]');if(!node)return;if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const next=Math.max(0,Math.min(buckets.length-1,Number(node.dataset.point)+(e.key==='ArrowRight'?1:-1)));svgEl.querySelector(`[data-point="${next}"]`).focus()}});
 window.chartModel={start,end,width:W,nowX,points,buckets};select(buckets.findIndex(b=>b.date===t));
}

async function backup(share=false){const exported={...state,backupAt:new Date().toISOString()},blob=new Blob([JSON.stringify(exported,null,2)],{type:'application/json'}),name='benim-borc-'+today()+'.json';try{const file=new File([blob],name,{type:'application/json'});if(share&&navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:'Benim Borç yedeği'});}else{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}commit(s=>s.backupAt=exported.backupAt);toast('Yedek dışa aktarıldı. Dosyayı güvenli bir yere kaydedin.')}catch(e){if(e.name!=='AbortError')toast('Yedek paylaşılamadı: '+e.message)}}
function importBackup(){openSheet('Yedekten yükle','<p class="help">Yükleme mevcut kayıtların tamamının yerini alır. Önce mevcut yedeğinizi alın.</p><label for="backupFile">JSON yedeğini seç</label><input id="backupFile" type="file" accept=".json,application/json"><div id="importInfo" role="status"></div>');$('#backupFile').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;if(file.size>10*1024*1024)throw Error('Yedek 10 MB sınırını aşıyor.');const o=validate(JSON.parse(await file.text()));$('#importInfo').innerHTML=`<div class="notice">${o.expenses.length} harcama, ${o.incomes.length} gelir, ${o.rules.length+o.payments.length} plan bulundu.</div><button class="primary full" id="applyImport">Mevcut kayıtları bu yedekle değiştir</button>`;$('#applyImport').onclick=()=>{if(persist(o)){closeSheet();tab='home';render();toast('Yedek yüklendi.');checkDue()}}}catch(err){$('#importInfo').textContent='Yüklenemedi: '+err.message}}}
let prompted=new Set();
function checkDue(){if($('#sheet').open||state.setup!==2)return;const i=state.incomes.find(i=>!i.confirmed&&i.date<=today()&&!prompted.has(i.id));if(!i)return;prompted.add(i.id);openSheet('Gelirini doğrula',`<p style="margin-top:20px"><b>${esc(i.name)} · ${fmt(i.amount)}</b></p><p class="help">${long(i.date)} için beklediğin ${fmt(i.amount)} geldi mi?</p><div class="form-actions"><button class="primary" id="confirmIncome">Evet, geldi</button><button class="secondary" id="delayIncome">Ertele</button></div><p class="help">Kapatırsan bekleniyor olarak kalır.</p>`);$('#confirmIncome').onclick=()=>{if(commit(s=>{s.incomes.find(x=>x.id===i.id).confirmed=true})){closeSheet();checkDue()}};$('#delayIncome').onclick=()=>{form('Geliri ertele',dateField(shift(today(),1),'Yeni tarih'),f=>{const d=readDate(f);if(d<=today())throw Error('Bugünden sonraki bir tarih seçin.');if(commit(s=>s.incomes.find(x=>x.id===i.id).date=d)){closeSheet();checkDue()}})}}
$('#sheet').addEventListener('close',()=>setTimeout(checkDue,100));
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,id=el.dataset.id;
 if(a==='tab'){tab=el.dataset.tab;render();window.scrollTo(0,0)}else if(a==='settings'){tab='settings';render();window.scrollTo(0,0)}else if(a==='close')closeSheet();else if(a==='range'){range=Number(el.dataset.range);render()}else if(a==='filter'){filter=el.dataset.filter;render()}else if(a==='initial')editBalance(true);else if(a==='balance')editBalance();else if(a==='finish'){commit(s=>s.setup=2);checkDue()}else if(a==='card')editCard(id);else if(a==='expense'||a==='income')editTransaction(a,id);else if(a==='rule'||a==='payment')editPlan(a,id);else if(a==='backup')backup();else if(a==='shareBackup')backup(true);else if(a==='import')importBackup();else if(a==='add'){openSheet('Yeni kayıt',`<div class="section"><button class="secondary full" data-action="expense">Harcama ekle</button><p class="help">Nakit veya kredi kartı harcaması</p></div><div class="section"><button class="primary full" data-action="income">Gelir ekle</button><p class="help">Gelen ya da gelecekte beklediğin para</p></div>`)}else if(a==='delete'){const key=el.dataset.key;openSheet('Kaydı sil',`<p class="help">Bu kayıt silinecek ve nakit akışı yeniden hesaplanacak.</p><div class="form-actions"><button class="secondary" data-action="close">Vazgeç</button><button class="delete" id="confirmDelete">Evet, sil</button></div>`);$('#confirmDelete').onclick=()=>{if(commit(s=>s[key]=s[key].filter(r=>r.id!==id))){closeSheet();toast('Kayıt silindi.')}}}else if(a==='adjustment'){const r=state.adjustments.find(x=>x.id===id);form('Bakiye düzeltmesi',amountField(r.amount)+dateField(r.date)+'<p class="help">Bu alan toplam bakiyeyi değil, bakiyeye eklenen/çıkarılan farkı düzenler.</p>',f=>{const n=readAmount(f,true),d=readDate(f);if(commit(s=>Object.assign(s.adjustments.find(x=>x.id===id),{amount:n,date:d})))closeSheet()},`<button type="button" class="delete full" data-action="delete" data-key="adjustments" data-id="${esc(id)}">Düzeltmeyi sil</button>`)}else if(a==='point'){const ps=window.chartGroups[Number(el.dataset.point)];openSheet(long(ps[0].date),`<div class="section">${ps.map(p=>`<div class="row"><div class="main"><b>${esc(p.name)}</b><small>${p.kind==='now'?'Bugünkü bakiye':p.pending?'Bekleniyor':p.date>today()?'Tahmin':'Gerçekleşen'}</small></div><b>${fmt(p.kind==='now'?p.value:p.amount,true)}</b></div>`).join('')}</div><p class="help">Bu hareketten sonra bakiye: ${fmt(ps.at(-1).value)}</p>`)}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-action="point"]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
// Service worker yalnız uygulama dosyalarını saklar. Hesap verileri ağa gönderilmez.
let offlineReady=false;
async function setupOffline(){
 if(!('serviceWorker' in navigator)||!['http:','https:'].includes(location.protocol))return;
 try{await navigator.serviceWorker.register('./sw.js',{scope:'./'});await navigator.serviceWorker.ready;offlineReady=true;document.querySelector('#offlineStatus')?.replaceChildren(document.createTextNode('Çevrimdışı kullanıma hazır'));}
 catch(error){document.querySelector('#offlineStatus')?.replaceChildren(document.createTextNode('Çevrimdışı kurulum tamamlanamadı. İnternet açıkken yeniden açın.'));}
}
setupOffline();
// Gece yarısını veya başka sekmedeki değişikliği kaçırmamak için görünürken yenile.
let lastDay=today();document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(lastDay!==today()){lastDay=today();render()}checkDue()}});setInterval(()=>{if(!document.hidden&&lastDay!==today()){lastDay=today();render();checkDue()}},30000);
window.addEventListener('storage',e=>{if(e.key===KEY){try{if(e.newValue){state=validate(JSON.parse(e.newValue));render();toast('Başka sekmedeki değişiklikler yüklendi.')}else toast('Kayıt alanı başka bir sekmede silindi. Yedek alın.')}catch(err){toast('Diğer sekmenin verisi okunamadı.')}}});
let chartResizeTimer;window.addEventListener('resize',()=>{clearTimeout(chartResizeTimer);chartResizeTimer=setTimeout(()=>{if(tab==='home'&&state.setup===2&&!$('#sheet').open)drawChart()},160)});
render();setTimeout(checkDue,300);
</script>
